name: aurafarm
description: "Aura Farm — face-triggered music player"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.6.3

  # State management
  flutter_riverpod: ^2.6.1

  # Camera & face detection
  camera: ^0.11.1
  google_mlkit_face_detection: ^0.11.0

  # ML / face recognition
  tflite_flutter: ^0.12.0

  # Audio
  just_audio: ^0.9.44
  audio_waveforms: ^1.3.0
  file_picker: ^8.3.7

  # File system & local storage (JSON files — no code gen needed)
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.5

  # Permissions
  permission_handler: ^11.4.0

  # Utilities
  uuid: ^4.5.1
  image: ^4.3.0

  # UI / animations
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  background_color: "#0A0A0A"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/icon/
